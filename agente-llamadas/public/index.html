<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habla con nuestra asistente</title>
<meta name="description" content="Prueba en vivo de un agente de voz con inteligencia artificial que agenda citas.">
<link rel="icon" href="/logo.png">
<style>
  :root {
    --fondo: #f6f3ec;
    --tarjeta: #ffffff;
    --texto: #1b1d1c;
    --suave: #5d6460;
    --marca: #1e3b2f;
    --marca-claro: #e3ece6;
    --colgar: #c2412d;
    --borde: #e4e0d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 24px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(30, 59, 47, .08);
  }
  .logo { height: 26px; margin-bottom: 28px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
  .sub { color: var(--suave); margin: 0 0 28px; }
  .orbe {
    position: relative;
    width: 148px; height: 148px;
    margin: 0 auto 20px;
    display: grid; place-items: center;
  }
  .orbe::before, .orbe::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--marca-claro); transform: scale(.82); opacity: 0;
    transition: opacity .3s;
  }
  .hablando .orbe::before { opacity: 1; animation: pulso 1.4s ease-out infinite; }
  .hablando .orbe::after { opacity: 1; animation: pulso 1.4s ease-out .7s infinite; }
  @keyframes pulso { from { transform: scale(.82); opacity: .9; } to { transform: scale(1.18); opacity: 0; } }
  button.llamar {
    position: relative; z-index: 1;
    width: 116px; height: 116px; border-radius: 50%; border: 0;
    background: var(--marca); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 10px 24px rgba(30, 59, 47, .28);
    transition: transform .15s, background .2s;
  }
  button.llamar:hover { transform: scale(1.04); }
  button.llamar:disabled { opacity: .6; cursor: wait; transform: none; }
  button.llamar svg { width: 44px; height: 44px; }
  .en-llamada button.llamar { background: var(--colgar); box-shadow: 0 10px 24px rgba(194, 65, 45, .28); }
  .en-llamada button.llamar svg { transform: rotate(135deg); }
  .estado { min-height: 1.5em; font-weight: 600; margin: 0 0 4px; }
  .nota { color: var(--suave); font-size: .875rem; margin: 0; }
  .error { color: var(--colgar); }
  #charla {
    text-align: left; margin-top: 24px; max-height: 260px; overflow-y: auto;
    display: none; flex-direction: column; gap: 8px;
    border-top: 1px solid var(--borde); padding-top: 16px;
  }
  #charla.visible { display: flex; }
  .msg { padding: 8px 12px; border-radius: 14px; max-width: 85%; font-size: .95rem; }
  .msg.agent { background: var(--marca-claro); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #f0eee8; align-self: flex-end; border-bottom-right-radius: 4px; }
  .reservar { display: none; margin-top: 20px; color: var(--marca); font-weight: 600; }
  .reservar.visible { display: inline-block; }
  footer { margin-top: 24px; color: var(--suave); font-size: .75rem; }
</style>
</head>
<body>
<main id="app">
  <img class="logo" src="/logo.png" alt="">
  <h1 id="titulo">Habla con nuestra asistente</h1>
  <p class="sub" id="sub">Es un agente de voz con inteligencia artificial. Pídele una cita como si llamaras por teléfono.</p>

  <div class="orbe">
    <button class="llamar" id="boton" aria-label="Iniciar llamada">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    </button>
  </div>
  <p class="estado" id="estado">Toca para llamar</p>
  <p class="nota" id="nota">Te pediremos permiso para usar el micrófono.</p>

  <div id="charla" aria-live="polite"></div>
  <a class="reservar" id="reservar" target="_blank" rel="noopener">O agenda tú mismo aquí →</a>
  <footer>La conversación puede grabarse para mejorar el servicio.</footer>
</main>

<script type="module">
  import { RetellWebClient } from '/vendor/retell-sdk.js';

  const $ = (id) => document.getElementById(id);
  const app = $('app'), boton = $('boton'), estado = $('estado'), nota = $('nota'), charla = $('charla');
  const clave = new URLSearchParams(location.search).get('c') || '';
  const cliente = new RetellWebClient();
  let enLlamada = false;

  fetch('/api/config').then((r) => r.json()).then((c) => {
    document.title = `Habla con ${c.asistente} · ${c.negocio}`;
    $('titulo').textContent = `Habla con ${c.asistente}`;
    $('sub').textContent = `${c.asistente} es la asistente virtual de ${c.negocio}. Pídele ${c.tipo_de_cita} como si llamaras por teléfono.`;
    if (c.link_reservas) $('reservar').href = c.link_reservas;
  }).catch(() => {});

  function mostrar(texto, esError = false) {
    estado.textContent = texto;
    estado.classList.toggle('error', esError);
  }

  function pintarCharla(transcript) {
    charla.classList.add('visible');
    charla.replaceChildren(...transcript.filter((t) => t.content).map((t) => {
      const d = document.createElement('div');
      d.className = `msg ${t.role === 'agent' ? 'agent' : 'user'}`;
      d.textContent = t.content;
      return d;
    }));
    charla.scrollTop = charla.scrollHeight;
  }

  function terminar() {
    enLlamada = false;
    app.classList.remove('en-llamada', 'hablando');
    boton.disabled = false;
    boton.setAttribute('aria-label', 'Iniciar llamada');
    mostrar('Llamada terminada. Toca para llamar de nuevo.');
    nota.textContent = '';
    if ($('reservar').href) $('reservar').classList.add('visible');
  }

  cliente.on('call_started', () => {
    enLlamada = true;
    app.classList.add('en-llamada');
    boton.disabled = false;
    boton.setAttribute('aria-label', 'Colgar');
    mostrar('En llamada');
    nota.textContent = 'Habla con naturalidad. Toca el botón rojo para colgar.';
  });
  cliente.on('agent_start_talking', () => app.classList.add('hablando'));
  cliente.on('agent_stop_talking', () => app.classList.remove('hablando'));
  cliente.on('update', (u) => u.transcript && pintarCharla(u.transcript));
  cliente.on('call_ended', terminar);
  cliente.on('error', (e) => {
    console.error(e);
    cliente.stopCall();
    terminar();
    mostrar('Se cortó la llamada. Intenta de nuevo.', true);
  });

  boton.addEventListener('click', async () => {
    if (enLlamada) { cliente.stopCall(); return; }
    boton.disabled = true;
    charla.classList.remove('visible');
    $('reservar').classList.remove('visible');
    mostrar('Conectando…');
    try {
      const r = await fetch(`/api/llamada${clave ? `?c=${encodeURIComponent(clave)}` : ''}`, { method: 'POST' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'No se pudo iniciar la llamada.');
      await cliente.startCall(d);
    } catch (e) {
      boton.disabled = false;
      const microfono = /permission|NotAllowed|denied/i.test(String(e?.name) + String(e?.message));
      mostrar(microfono ? 'Necesitamos permiso para usar tu micrófono.' : e.message, true);
    }
  });
</script>
</body>
</html>
