<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Bigotón Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen camera app — 9:16 stage on top, controls in a warm bottom bar */
:root {
  --bg: #1a100b;
  --panel: #2a1a12;
  --fg: #fbeedd;
  --muted: #c9a98a;
  --accent: #f08a24;
  --gold: #e9b949;
  --rec: #e5432f;
  --display: "Shrikhand", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
header {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
}
h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--accent); letter-spacing: .01em; }
#status { font-size: .8rem; color: var(--muted); text-align: right; }
#stage {
  flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
#out {
  max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; border-radius: 18px;
  background: #000; box-shadow: 0 0 0 2px #3b2619;
}
#out.photo { aspect-ratio: auto; }
#recbadge {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  background: var(--rec); color: #fff; font-weight: 700; font-size: .85rem;
  padding: 4px 12px; border-radius: 99px; font-variant-numeric: tabular-nums;
}
#intro {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 24px;
}
#intro p { max-width: 32ch; color: var(--muted); margin: 0; line-height: 1.45; }
#intro .big { font-family: var(--display); font-size: 2.2rem; color: var(--fg); line-height: 1.05; text-wrap: balance; }
.controls {
  display: flex; flex-direction: column; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
}
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip {
  font: 600 .85rem var(--body); color: var(--muted); background: transparent;
  border: 1.5px solid #5a3a26; border-radius: 99px; padding: 6px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.row { display: flex; align-items: center; justify-content: center; gap: 22px; }
.round {
  width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--panel); color: var(--fg); display: grid; place-items: center;
}
.round svg { width: 22px; height: 22px; }
#shutter {
  width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--fg); background: var(--accent);
  cursor: pointer; position: relative;
}
#shutter.recording { background: var(--rec); }
#shutter.recording::after {
  content: ""; position: absolute; inset: 22px; border-radius: 6px; background: #fff;
}
.modes { display: flex; justify-content: center; gap: 18px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.mode { background: none; border: 0; color: var(--muted); font: 700 .8rem var(--body); letter-spacing: .08em; cursor: pointer; padding: 4px; }
.mode[aria-pressed="true"] { color: var(--gold); }
.btn {
  font: 700 1rem var(--body); border: 0; border-radius: 99px; padding: 12px 22px; cursor: pointer;
  background: var(--accent); color: #1a100b;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid #5a3a26; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#sheet {
  position: fixed; inset: 0; background: rgba(15, 9, 6, .94); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; z-index: 20;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#preview { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
#preview img, #preview video { max-width: 100%; max-height: 100%; border-radius: 14px; }
#sheet .row { flex-wrap: wrap; gap: 12px; }
#hint { color: var(--muted); font-size: .85rem; text-align: center; max-width: 40ch; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  #shutter { transition: transform .12s; }
  #shutter:active { transform: scale(.92); }
}
</style>

<body>
<header>
  <h1>Bigotón Real</h1>
  <div id="status">Cargando filtro…</div>
</header>

<div id="stage">
  <canvas id="out" width="720" height="1280"></canvas>
  <div id="recbadge" hidden>● 0.0 s</div>
  <div id="intro">
    <div class="big">Bigote, aviadores y mullet</div>
    <p>El filtro sigue tu cara en vivo. Toma foto o graba un video y compártelo en Instagram.</p>
    <button class="btn" id="startCam" type="button">Abrir cámara</button>
    <button class="btn ghost" id="pickPhoto" type="button">Usar una foto</button>
  </div>
</div>

<div class="controls">
  <div class="chips" role="group" aria-label="Accesorios">
    <button class="chip" type="button" data-k="stache" aria-pressed="true">Bigote</button>
    <button class="chip" type="button" data-k="glasses" aria-pressed="true">Aviadores</button>
    <button class="chip" type="button" data-k="hair" aria-pressed="true">Mullet</button>
    <button class="chip" type="button" data-k="grade" aria-pressed="false">Tono 70s</button>
  </div>
  <div class="row">
    <button class="round" id="upload" type="button" aria-label="Usar una foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>
    </button>
    <button id="shutter" type="button" aria-label="Tomar foto"></button>
    <button class="round" id="flip" type="button" aria-label="Cambiar cámara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
  </div>
  <div class="modes" role="group" aria-label="Modo">
    <button class="mode" type="button" data-mode="photo" aria-pressed="true">Foto</button>
    <button class="mode" type="button" data-mode="video" aria-pressed="false">Video</button>
  </div>
</div>

<div id="sheet" hidden>
  <div id="preview"></div>
  <p id="hint"></p>
  <div class="row">
    <button class="btn" id="share" type="button">Compartir</button>
    <button class="btn ghost" id="save" type="button">Guardar</button>
    <button class="btn ghost" id="again" type="button">Otra</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<video id="cam" playsinline muted autoplay hidden></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_LOCAL = "./face_landmarker.task";
const MODEL_REMOTE = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const $ = (s) => document.querySelector(s);
const out = $("#out"), ctx = out.getContext("2d");
const video = $("#cam");
const statusEl = $("#status");
const on = { stache: true, glasses: true, hair: true, grade: false };

let landmarker = null, runMode = "VIDEO";
let stream = null, facing = "user", source = null; // "cam" | "photo"
let photoImg = null, photoLm = null;
let mode = "photo", recorder = null, recChunks = [], recStart = 0, recTimer = null;
let result = null; // { blob, name, type }
let smooth = null, lostFrames = 0, lastTs = -1;

/* ---------- model ---------- */
async function loadModel() {
  const files = await FilesetResolver.forVisionTasks(WASM);
  let modelBuf;
  try {
    const r = await fetch(MODEL_LOCAL);
    if (!r.ok) throw 0;
    modelBuf = new Uint8Array(await r.arrayBuffer());
  } catch { modelBuf = null; }
  const base = modelBuf ? { modelAssetBuffer: modelBuf } : { modelAssetPath: MODEL_REMOTE };
  const opts = (delegate) => ({ baseOptions: { ...base, delegate }, runningMode: "VIDEO", numFaces: 1 });
  try { landmarker = await FaceLandmarker.createFromOptions(files, opts("GPU")); }
  catch { landmarker = await FaceLandmarker.createFromOptions(files, opts("CPU")); }
  runMode = "VIDEO";
}
const modelReady = loadModel().then(
  () => { statusEl.textContent = "Listo"; },
  (e) => { statusEl.textContent = "No se pudo cargar el filtro. Revisa tu conexión y recarga."; console.error(e); throw e; }
);
async function setMode(m) { if (runMode !== m) { await landmarker.setOptions({ runningMode: m }); runMode = m; } }

/* ---------- geometry helpers ---------- */
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b, t = 0.5) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
// 2D frame with separate x / y scale: lets each side of a face shrink on its own when the head turns
function frame(origin, ang, ux, uy = ux) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return {
    m: [c * ux, s * ux, -s * uy, c * uy, origin.x, origin.y],
    apply(g) { g.setTransform(...this.m); },
    pt(x, y) { const m = this.m; return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] }; },
  };
}
const along = (p, o, ang) => (p.x - o.x) * Math.cos(ang) + (p.y - o.y) * Math.sin(ang);

/* ---------- assets: real hair cut out of a photo, strand-rendered moustache ---------- */
const HAIR_META = {"w": 879, "h": 1005, "oval": [[398.0, 330.1], [432.1, 323.6], [461.8, 322.6], [490.2, 328.5], [510.8, 342.7], [525.9, 363.9], [535.8, 388.5], [544.5, 419.8], [551.3, 449.8], [558.1, 480.1], [563.6, 512.7], [566.9, 545.7], [566.7, 571.2], [562.8, 588.7], [552.9, 604.8], [542.2, 616.1], [529.9, 625.8], [513.8, 635.3], [490.3, 643.9], [463.4, 651.4], [439.3, 654.2], [415.9, 654.8], [392.9, 652.8], [365.4, 646.7], [341.9, 635.9], [318.7, 615.3], [299.0, 584.1], [284.7, 552.3], [274.5, 521.8], [266.0, 491.3], [262.4, 457.2], [265.6, 427.7], [277.0, 398.6], [296.8, 373.5], [327.6, 353.2], [360.9, 339.9]]};
const STACHE_META = { unitPx: 600, x0: -0.82, y0: -0.42 };
const loadImg = (src) => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
let hairImg = null, stacheImg = null;
const assetsReady = Promise.all([loadImg("assets/pelo.png"), loadImg("assets/bigote.png")]).then(([h, s]) => { hairImg = h; stacheImg = s; initGL(); });

/* ---------- hair: textured mesh in WebGL, rings radiating out from the face outline ---------- */
const RINGS = [0.72, 1, 1.35, 1.8, 2.5, 3.4];
const glc = document.createElement("canvas");
let gl = null, glProg, glBuf, glUV, glIdx, glN = 0, uRes, uGain;
function initGL() {
  gl = glc.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
  if (!gl) return;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  glProg = gl.createProgram();
  gl.attachShader(glProg, sh(gl.VERTEX_SHADER, "attribute vec2 p;attribute vec2 uv;uniform vec2 res;varying vec2 v;void main(){v=uv;vec2 c=p/res*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.0,1.0);}"));
  gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, "precision mediump float;varying vec2 v;uniform sampler2D t;uniform float gain;void main(){vec4 c=texture2D(t,v);gl_FragColor=vec4(c.rgb*gain,c.a);}"));
  gl.linkProgram(glProg); gl.useProgram(glProg);
  uRes = gl.getUniformLocation(glProg, "res"); uGain = gl.getUniformLocation(glProg, "gain");
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hairImg);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  // texture coordinates are fixed: rings around the outline of the face in the source photo
  const so = HAIR_META.oval, n = so.length;
  const sc = so.reduce((a, p) => [a[0] + p[0] / n, a[1] + p[1] / n], [0, 0]);
  const uv = [];
  for (const k of RINGS) for (const p of so) uv.push((sc[0] + (p[0] - sc[0]) * k) / HAIR_META.w, (sc[1] + (p[1] - sc[1]) * k) / HAIR_META.h);
  const idx = [];
  for (let r = 0; r < RINGS.length - 1; r++) for (let i = 0; i < n; i++) {
    const a = r * n + i, b = r * n + (i + 1) % n, c = (r + 1) * n + i, d = (r + 1) * n + (i + 1) % n;
    idx.push(a, b, c, b, d, c);
  }
  glN = idx.length;
  glUV = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, glUV); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uv), gl.STATIC_DRAW);
  const uvLoc = gl.getAttribLocation(glProg, "uv"); gl.enableVertexAttribArray(uvLoc); gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);
  glIdx = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, glIdx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  glBuf = gl.createBuffer();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
}
function drawHair(g, P, gain) {
  if (!gl) return;
  const dst = OVAL.map((i) => P(i)), n = dst.length;
  const c = dst.reduce((a, p) => ({ x: a.x + p.x / n, y: a.y + p.y / n }), { x: 0, y: 0 });
  const pos = [];
  for (const k of RINGS) for (const p of dst) pos.push(c.x + (p.x - c.x) * k, c.y + (p.y - c.y) * k);
  if (glc.width !== out.width || glc.height !== out.height) { glc.width = out.width; glc.height = out.height; }
  gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uRes, glc.width, glc.height); gl.uniform1f(uGain, gain);
  gl.bindBuffer(gl.ARRAY_BUFFER, glBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.DYNAMIC_DRAW);
  const pLoc = gl.getAttribLocation(glProg, "p"); gl.enableVertexAttribArray(pLoc); gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
  gl.drawElements(gl.TRIANGLES, glN, gl.UNSIGNED_SHORT, 0);
  const faceW = dist(P(234), P(454));
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.save();
  g.shadowColor = "rgba(20,10,5,.45)"; g.shadowBlur = faceW * 0.06; g.shadowOffsetY = faceW * 0.015;
  g.drawImage(glc, 0, 0);
  g.restore();
}

/* ---------- moustache: each half scaled by its own side of the mouth ---------- */
function drawStache(g, P, L, R) {
  const l = L(61), r = R(291);
  const ang = Math.atan2(r.y - l.y, r.x - l.x);
  const anchor = mid(P(2), P(0), 0.6);
  const k = 1.02 / 0.5; // the drawing's unit = mouth width * 1.02; each corner sits half a mouth width out
  const sL = Math.max(1, -along(l, anchor, ang)) * k, sR = Math.max(1, along(r, anchor, ang)) * k;
  const uy = (sL + sR) / 2;
  const uL = uy + (sL - uy) * 0.5, uR = uy + (sR - uy) * 0.5; // keep half of the turn, the rest reads as a lopsided stache
  const { unitPx, x0, y0 } = STACHE_META;
  for (const [ux, side] of [[uL, -1], [uR, 1]]) {
    const F = frame(anchor, ang, ux, uy);
    g.save();
    F.apply(g);
    g.beginPath(); g.rect(side < 0 ? -1.2 : -0.004, -1, 1.204, 2.2); g.clip();
    g.shadowColor = "rgba(30,12,4,.45)"; g.shadowBlur = uy * 0.05; g.shadowOffsetY = uy * 0.03;
    g.drawImage(stacheImg, x0, y0, stacheImg.width / unitPx, stacheImg.height / unitPx);
    g.restore();
  }
}

/* ---------- aviators: metal frame, multiplied tint so your own eyes show through ---------- */
const LENS_K = 1.22;
const LENS = (() => {
  const p = new Path2D(), k = LENS_K;
  p.moveTo(-0.24 * k, -0.17 * k);
  p.bezierCurveTo(-0.05 * k, -0.21 * k, 0.18 * k, -0.21 * k, 0.27 * k, -0.15 * k);
  p.bezierCurveTo(0.33 * k, -0.08 * k, 0.31 * k, 0.1 * k, 0.2 * k, 0.2 * k);
  p.bezierCurveTo(0.1 * k, 0.29 * k, -0.1 * k, 0.27 * k, -0.18 * k, 0.17 * k);
  p.bezierCurveTo(-0.26 * k, 0.06 * k, -0.27 * k, -0.1 * k, -0.24 * k, -0.17 * k);
  p.closePath();
  return p;
})();
function gold(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, "#fff1c4"); gr.addColorStop(0.25, "#d9ac4c"); gr.addColorStop(0.55, "#8a6220"); gr.addColorStop(0.8, "#e6c26a"); gr.addColorStop(1, "#7a541a");
  return gr;
}
function drawGlasses(g, P, L, R) {
  const oL = L(33), iL = L(133), oR = R(263), iR = R(362);
  const ang = Math.atan2(oR.y - oL.y, oR.x - oL.x);
  const wL = dist(oL, iL), wR = dist(oR, iR);
  const uy = Math.max(wL, wR) / 0.34;              // lens height follows the nearer, un-foreshortened eye
  const lenses = [[mid(oL, iL), wL / 0.34, -1], [mid(oR, iR), wR / 0.34, 1]];
  const pts = {};
  for (const [c, ux, side] of lenses) {
    const F = frame(c, ang, ux * side, uy);        // negative x scale mirrors the lens for the left eye
    const lift = 0.07;
    const G = { m: F.m, pt: (x, y) => F.pt(x, y + lift) };
    pts[side] = { inTop: G.pt(-0.24 * LENS_K, -0.17 * LENS_K), inMid: G.pt(-0.255 * LENS_K, -0.03 * LENS_K), hinge: G.pt(0.28 * LENS_K, -0.14 * LENS_K), ux };
    g.save();
    g.setTransform(...F.m); g.translate(0, lift);
    // tint: multiply, so the skin and eyes behind stay visible like real brown gradient lenses
    g.globalCompositeOperation = "multiply";
    const tint = g.createLinearGradient(0, -0.25, 0, 0.33);
    tint.addColorStop(0, "rgb(92,58,38)"); tint.addColorStop(0.5, "rgb(150,100,66)"); tint.addColorStop(1, "rgb(222,178,132)");
    g.fillStyle = tint; g.fill(LENS);
    g.globalCompositeOperation = "source-over";
    // reflections on the glass
    g.save(); g.clip(LENS);
    const sky = g.createLinearGradient(0, -0.26, 0, 0.05);
    sky.addColorStop(0, "rgba(255,236,210,.22)"); sky.addColorStop(1, "rgba(255,236,210,0)");
    g.fillStyle = sky; g.fill(LENS);
    g.fillStyle = "rgba(255,250,240,.13)";
    g.beginPath(); g.moveTo(-0.22, 0.12); g.lineTo(0.02, -0.26); g.lineTo(0.09, -0.26); g.lineTo(-0.16, 0.16); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,250,240,.07)";
    g.beginPath(); g.moveTo(-0.1, 0.2); g.lineTo(0.14, -0.26); g.lineTo(0.17, -0.26); g.lineTo(-0.07, 0.22); g.closePath(); g.fill();
    g.restore();
    // metal rim with a soft shadow on the skin, then a dark inner edge and a specular glint
    g.shadowColor = "rgba(25,12,4,.4)"; g.shadowBlur = uy * 0.04; g.shadowOffsetY = uy * 0.025;
    g.strokeStyle = gold(g, -0.26, 0.3); g.lineWidth = 0.026; g.stroke(LENS);
    g.shadowColor = "transparent";
    g.strokeStyle = "rgba(60,38,10,.55)"; g.lineWidth = 0.007; g.stroke(LENS);
    g.strokeStyle = "rgba(255,250,225,.85)"; g.lineWidth = 0.008; g.lineCap = "round";
    g.beginPath(); g.moveTo(-0.12, -0.245); g.quadraticCurveTo(0.06, -0.262, 0.2, -0.235); g.stroke();
    // nose pad
    g.fillStyle = "rgba(255,255,255,.28)"; g.strokeStyle = "rgba(180,150,90,.6)"; g.lineWidth = 0.006;
    g.beginPath(); g.ellipse(-0.27, 0.06, 0.025, 0.05, 0.4, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
  }
  // double bridge + temple arms, drawn in screen space
  const lw = uy * 0.024;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.lineCap = "round";
  g.shadowColor = "rgba(25,12,4,.35)"; g.shadowBlur = uy * 0.03; g.shadowOffsetY = uy * 0.02;
  const a = pts[-1], b = pts[1];
  const mTop = mid(a.inTop, b.inTop), mMid = mid(a.inMid, b.inMid);
  const nrm = { x: Math.sin(ang), y: -Math.cos(ang) };
  const yb = Math.min(a.inTop.y, b.inTop.y) - uy * 0.2;
  g.strokeStyle = gold(g, yb, yb + uy * 0.3);
  g.lineWidth = lw * 0.9;
  g.beginPath(); g.moveTo(a.inTop.x, a.inTop.y); g.quadraticCurveTo(mTop.x + nrm.x * uy * 0.03, mTop.y + nrm.y * uy * 0.03, b.inTop.x, b.inTop.y); g.stroke();
  g.lineWidth = lw * 1.1;
  g.beginPath(); g.moveTo(a.inMid.x, a.inMid.y); g.quadraticCurveTo(mMid.x + nrm.x * uy * 0.09, mMid.y + nrm.y * uy * 0.09, b.inMid.x, b.inMid.y); g.stroke();
  // arms run back to the ears; the far one hides behind the head when you turn
  const ratio = wL / wR;
  for (const [h, ear, show] of [[a.hinge, L(234), ratio > 0.72], [b.hinge, R(454), ratio < 1 / 0.72]]) {
    if (!show) continue;
    const e = { x: ear.x + nrm.x * uy * 0.08, y: ear.y + nrm.y * uy * 0.08 };
    g.lineWidth = lw * 1.2;
    g.beginPath(); g.moveTo(h.x, h.y); g.lineTo(e.x, e.y); g.stroke();
  }
  g.restore();
}

/* ---------- compose a frame ---------- */
const PAIRS = [[234, 454], [33, 263], [133, 362], [61, 291], [172, 397]];
const PAIR = {}, PAIR_R = {};
for (const [a, b] of PAIRS) { PAIR[a] = b; PAIR_R[b] = a; }
const probe = document.createElement("canvas"); probe.width = probe.height = 12;
const pctx = probe.getContext("2d", { willReadFrequently: true });
let gain = 1, gainTick = 0;
function sceneGain(c) { // match the photo hair to the room light: darker scene, darker hair
  if (gainTick++ % 15) return gain;
  try {
    pctx.drawImage(out, c.x - out.width * 0.2, c.y - out.height * 0.15, out.width * 0.4, out.height * 0.3, 0, 0, 12, 12);
    const d = pctx.getImageData(0, 0, 12, 12).data; let s = 0;
    for (let i = 0; i < d.length; i += 4) s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const target = Math.max(0.55, Math.min(1.1, s / 144 / 125));
    gain += (target - gain) * 0.5;
  } catch { /* keep last value */ }
  return gain;
}
function drawFilters(lm, map, mirrored) {
  const P = (i) => map(lm[i]);
  // (unmirrored image: 234/33/133/61/172 sit on the left; a selfie mirror swaps them)
  const L = (i) => map(lm[mirrored ? PAIR[i] : i]);
  const R = (i) => map(lm[mirrored ? PAIR_R[i] : i]);
  const gn = sceneGain(P(1));
  if (on.hair) drawHair(ctx, P, gn);
  if (on.stache) drawStache(ctx, P, L, R);
  if (on.glasses) drawGlasses(ctx, P, L, R);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function grade() {
  if (!on.grade) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  ctx.fillStyle = "rgba(255,150,60,.5)"; ctx.fillRect(0, 0, out.width, out.height);
  ctx.restore();
}

/* ---------- camera loop ---------- */
async function startCamera() {
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    statusEl.textContent = "Sin acceso a la cámara. Permítelo en el navegador o usa una foto.";
    return;
  }
  video.srcObject = stream; await video.play();
  source = "cam"; photoImg = null; out.classList.remove("photo");
  out.width = 720; out.height = 1280;
  $("#intro").hidden = true;
  statusEl.textContent = "Busca tu cara…";
  await Promise.all([modelReady, assetsReady]); await setMode("VIDEO");
  requestAnimationFrame(loop);
}
function stopCamera() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

function loop() {
  if (source !== "cam" || !stream) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw) {
    const W = out.width, H = out.height;
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, dx = (W - dw) / 2, dy = (H - dh) / 2;
    const mirrored = facing === "user";
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (mirrored) ctx.setTransform(-1, 0, 0, 1, W, 0);
    ctx.drawImage(video, dx, dy, dw, dh);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    grade();
    let ts = performance.now(); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
    const res = landmarker.detectForVideo(video, ts);
    const lm = res.faceLandmarks?.[0];
    if (lm) {
      if (!smooth) smooth = lm.map((p) => ({ x: p.x, y: p.y }));
      else for (let i = 0; i < lm.length; i++) { smooth[i].x += (lm[i].x - smooth[i].x) * 0.55; smooth[i].y += (lm[i].y - smooth[i].y) * 0.55; }
      lostFrames = 0;
      if (statusEl.textContent !== "Listo") statusEl.textContent = "Listo";
    } else if (++lostFrames > 8) { smooth = null; statusEl.textContent = "Busca tu cara…"; }
    if (smooth) {
      const map = (p) => { const x = dx + p.x * dw; return { x: mirrored ? W - x : x, y: dy + p.y * dh }; };
      drawFilters(smooth, map, mirrored);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- photo upload ---------- */
async function usePhoto(file) {
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  stopCamera(); source = "photo"; photoImg = img;
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  out.width = Math.round(img.naturalWidth * k); out.height = Math.round(img.naturalHeight * k);
  out.classList.add("photo");
  $("#intro").hidden = true;
  statusEl.textContent = "Analizando foto…";
  await Promise.all([modelReady, assetsReady]); await setMode("IMAGE");
  photoLm = landmarker.detect(img).faceLandmarks?.[0] || null;
  statusEl.textContent = photoLm ? "Listo" : "No encontré una cara en esa foto. Prueba otra de frente.";
  renderPhoto();
  setVideoModeAvailable(false);
}
function renderPhoto() {
  if (!photoImg) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(photoImg, 0, 0, out.width, out.height);
  grade();
  if (photoLm) drawFilters(photoLm, (p) => ({ x: p.x * out.width, y: p.y * out.height }), false);
}

/* ---------- capture ---------- */
function stamp() { const d = new Date(); return `bigoton-real-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}-${d.getHours()}${d.getMinutes()}${d.getSeconds()}`; }
function takePhoto() {
  out.toBlob((blob) => showResult({ blob, name: stamp() + ".jpg", type: "image/jpeg" }), "image/jpeg", 0.92);
}
function pickMime() {
  const opts = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  return opts.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
function startRec() {
  const mime = pickMime();
  if (!mime) { statusEl.textContent = "Este navegador no puede grabar video. Usa modo Foto."; return; }
  const s = out.captureStream(30);
  recorder = new MediaRecorder(s, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  recChunks = [];
  recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
  recorder.onstop = () => {
    const type = mime.split(";")[0];
    showResult({ blob: new Blob(recChunks, { type }), name: stamp() + (type === "video/mp4" ? ".mp4" : ".webm"), type });
  };
  recorder.start(250);
  recStart = performance.now();
  $("#shutter").classList.add("recording"); $("#shutter").setAttribute("aria-label", "Detener grabación");
  $("#recbadge").hidden = false;
  recTimer = setInterval(() => {
    const t = (performance.now() - recStart) / 1000;
    $("#recbadge").textContent = `● ${t.toFixed(1)} s / 15 s`;
    if (t >= 15) stopRec();
  }, 100);
}
function stopRec() {
  if (!recorder) return;
  clearInterval(recTimer); recorder.stop(); recorder = null;
  $("#shutter").classList.remove("recording"); $("#shutter").setAttribute("aria-label", "Grabar video");
  $("#recbadge").hidden = true;
}

function showResult(r) {
  result = r;
  const pv = $("#preview"); pv.textContent = "";
  const url = URL.createObjectURL(r.blob);
  const el = r.type.startsWith("video") ? Object.assign(document.createElement("video"), { src: url, controls: true, loop: true, playsInline: true, autoplay: true, muted: true }) : Object.assign(document.createElement("img"), { src: url, alt: "Tu foto con el filtro" });
  pv.append(el);
  const canShare = navigator.canShare?.({ files: [new File([r.blob], r.name, { type: r.type })] });
  $("#share").hidden = !canShare;
  $("#hint").textContent = r.name.endsWith(".webm")
    ? "Este navegador graba en WebM, que Instagram no acepta. Para subirlo a Instagram, graba desde Safari o Chrome en el celular (MP4)."
    : canShare ? "Toca Compartir y elige Instagram (Historia, Reel o Feed)." : "Guárdalo y súbelo desde la app de Instagram.";
  $("#sheet").hidden = false;
}
async function share() {
  try { await navigator.share({ files: [new File([result.blob], result.name, { type: result.type })] }); }
  catch (e) { if (e.name !== "AbortError") $("#hint").textContent = "No se pudo compartir. Usa Guardar y súbelo desde Instagram."; }
}
function save() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(result.blob); a.download = result.name;
  document.body.append(a); a.click(); a.remove();
}

/* ---------- UI wiring ---------- */
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.k; on[k] = !on[k]; b.setAttribute("aria-pressed", on[k]);
  if (source === "photo") renderPhoto();
}));
function setVideoModeAvailable(ok) {
  const vb = document.querySelector('[data-mode="video"]');
  vb.disabled = !ok; vb.style.opacity = ok ? 1 : 0.35;
  if (!ok) selectMode("photo");
}
function selectMode(m) {
  mode = m;
  document.querySelectorAll(".mode").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
  $("#shutter").setAttribute("aria-label", m === "photo" ? "Tomar foto" : "Grabar video");
}
document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => selectMode(b.dataset.mode)));
$("#shutter").addEventListener("click", () => {
  if (!source) return startCamera();
  if (mode === "photo") return takePhoto();
  recorder ? stopRec() : startRec();
});
$("#startCam").addEventListener("click", () => { setVideoModeAvailable(true); startCamera(); });
$("#flip").addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; smooth = null; setVideoModeAvailable(true); startCamera(); });
for (const id of ["#upload", "#pickPhoto"]) $(id).addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => { usePhoto(e.target.files[0]); e.target.value = ""; });
$("#share").addEventListener("click", share);
$("#save").addEventListener("click", save);
$("#again").addEventListener("click", () => { $("#sheet").hidden = true; });

// draw an idle backdrop until something starts
ctx.fillStyle = "#24160e"; ctx.fillRect(0, 0, out.width, out.height);
window.__filtro = { usePhoto, startCamera, state: () => ({ source, hasFace: !!(smooth || photoLm) }) };
</script>
</body>
