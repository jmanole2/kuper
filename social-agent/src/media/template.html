<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Plantilla de animación 2D para posts: texto cinético sobre papel recortado.
 * window.SPEC = { width, height, duration, fps, colors[], escenas:[{titular, apoyo}], cierre, marca, logoUrl, fontUrls }
 * window.ANIM.render(t) dibuja el cuadro en el segundo t. window.ANIM.ready es una promesa.
 */
'use strict';
(() => {
  const S = window.SPEC;
  const W = S.width, H = S.height, U = Math.min(W, H) / 1080; // unidad relativa
  const cv = document.getElementById('c');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // ------------------------------------------------------------ utilidades
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const outBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  // ------------------------------------------------------------ paleta
  const hex = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); return m ? m[1] : null; };
  const rgb = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (h) => { const c = rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const sat = (h) => { const c = rgb(h); const mx = Math.max(...c), mn = Math.min(...c); return mx ? (mx - mn) / mx : 0; };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const shade = (h, k) => '#' + rgb(h).map((v) => Math.round(clamp(v * k, 0, 255)).toString(16).padStart(2, '0')).join('');
  const cols = (S.colors || []).map(hex).filter(Boolean);
  const bg = cols[0] || '1d1d1f';
  const accent = cols.slice(1).sort((a, b) => sat(b) - sat(a))[0] || (lum(bg) > 0.5 ? '1d1d1f' : 'ff6b35');
  const lights = cols.filter((c) => lum(c) > 0.6 && c !== bg);
  const paper = lights[0] || 'f4efe6';
  const inkOn = (b) => (contrast(b, '111111') >= contrast(b, 'ffffff') ? '#111111' : '#ffffff');
  const P = { bg: '#' + bg, accent: '#' + accent, paper: '#' + paper, inkPaper: inkOn(paper), inkBg: inkOn(bg), inkAccent: inkOn(accent) };

  // ------------------------------------------------------------ tiempos
  const escenas = S.escenas || [];
  const T_INTRO = 0.5, T_OUTRO = Math.min(2.4, S.duration * 0.28);
  const sceneLen = (S.duration - T_INTRO - T_OUTRO) / Math.max(1, escenas.length);

  // ------------------------------------------------------------ texto
  function wrap(text, font, maxW) {
    ctx.font = font;
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const lines = []; let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }
  function fit(text, weight, maxW, maxH, start) {
    for (let size = start; size > 20 * U; size -= 4 * U) {
      const font = `${weight} ${size}px "DM Sans", sans-serif`;
      const lines = wrap(text, font, maxW);
      if (lines.length * size * 1.08 <= maxH && lines.every((l) => (ctx.font = font, ctx.measureText(l).width <= maxW))) return { font, size, lines };
    }
    const font = `${weight} ${20 * U}px "DM Sans", sans-serif`;
    return { font, size: 20 * U, lines: wrap(text, font, maxW) };
  }

  // ------------------------------------------------------------ papel
  function paperShape(path, fill, lift = 1) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 26 * U * lift; ctx.shadowOffsetY = 12 * U * lift;
    ctx.fillStyle = fill; ctx.fill(path);
    ctx.restore();
    // borde superior iluminado, como corte de papel
    ctx.save(); ctx.clip(path);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(0,0,0,0.06)');
    ctx.fillStyle = g; ctx.fill(path); ctx.restore();
  }
  function blobPath(cx, cy, r, wob, phase) {
    const p = new Path2D(); const n = 9;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rr = r * (1 + wob * Math.sin(a * 3 + phase) * 0.5 + wob * Math.cos(a * 2 - phase) * 0.3);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath(); return p;
  }
  function roundRect(x, y, w, h, r) {
    const p = new Path2D(); p.roundRect(x, y, w, h, r); return p;
  }

  // grano fijo para que el video no "hierva"
  const grain = document.createElement('canvas'); grain.width = 256; grain.height = 256;
  { const g = grain.getContext('2d'); const id = g.createImageData(256, 256);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (rnd() - 0.5) * 60; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 18; }
    g.putImageData(id, 0, 0); }

  // formas de fondo (se generan una vez)
  const deco = Array.from({ length: 5 }, (_, i) => ({
    x: rnd() * W, y: rnd() * H, r: (120 + rnd() * 220) * U, ph: rnd() * 6, sp: 0.15 + rnd() * 0.25,
    col: i % 2 ? shade(P.bg, 1.18) : shade(P.bg, 0.86),
  }));

  function background(t) {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    for (const d of deco) {
      const k = outCubic(seg(t, 0, 0.9));
      paperShape(blobPath(d.x + Math.sin(t * d.sp + d.ph) * 30 * U, d.y + Math.cos(t * d.sp) * 24 * U, d.r * k, 0.18, t * d.sp + d.ph), d.col, 0.6);
    }
  }

  // ------------------------------------------------------------ escena
  function drawScene(e, t0, t, idx) {
    const u = (t - t0) / sceneLen;
    const inK = outCubic(seg(u, 0, 0.22));
    const outK = inOut(seg(u, 0.86, 1));
    const last = idx === escenas.length - 1;
    const margin = 90 * U;
    const cardW = W - margin * 2;
    const hasApoyo = !!(e.apoyo && e.apoyo.trim());
    const tit = fit(e.titular, 700, cardW - 100 * U, H * (hasApoyo ? 0.3 : 0.42), 132 * U);
    const apo = hasApoyo ? fit(e.apoyo, 500, cardW - 110 * U, H * 0.18, 54 * U) : { lines: [], size: 0 };
    const cardH = tit.lines.length * tit.size * 1.08 + (hasApoyo ? apo.lines.length * apo.size * 1.3 + 60 * U : 0) + 150 * U;
    const cx = W / 2, cy = H / 2;
    const slide = (1 - inK) * H * 0.6 - (last ? 0 : outK * H * 0.7);
    const rot = (1 - inK) * -0.08 + (last ? 0 : outK * 0.06);

    ctx.save();
    ctx.translate(cx, cy + slide); ctx.rotate(rot);
    // tira de color detrás de la tarjeta
    paperShape(roundRect(-cardW / 2 + 26 * U, -cardH / 2 + 30 * U, cardW, cardH, 34 * U), P.accent, 0.8);
    paperShape(roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 34 * U), P.paper, 1);
    // número de escena
    if (escenas.length > 1) {
      ctx.fillStyle = P.accent; ctx.font = `700 ${34 * U}px "DM Sans", sans-serif`; ctx.textBaseline = 'alphabetic';
      ctx.fillText(String(idx + 1).padStart(2, '0'), -cardW / 2 + 56 * U, -cardH / 2 + 80 * U);
    }

    // titular palabra por palabra
    ctx.fillStyle = P.inkPaper; ctx.font = tit.font; ctx.textBaseline = 'top';
    let y = -cardH / 2 + 110 * U; let wi = 0;
    for (const line of tit.lines) {
      let x = -cardW / 2 + 56 * U;
      for (const w of line.split(' ')) {
        const k = outBack(seg(u, 0.08 + wi * 0.045, 0.2 + wi * 0.045));
        ctx.save(); ctx.globalAlpha = clamp(k * 1.5);
        ctx.translate(x, y + (1 - k) * 40 * U); ctx.fillText(w, 0, 0); ctx.restore();
        x += ctx.measureText(w + ' ').width; wi++;
      }
      y += tit.size * 1.08;
    }
    // subrayado de papel
    const ul = outCubic(seg(u, 0.25, 0.45));
    ctx.fillStyle = P.accent; ctx.fillRect(-cardW / 2 + 56 * U, y + 10 * U, (cardW * 0.28) * ul, 12 * U);
    // apoyo
    if (hasApoyo) {
      ctx.font = apo.font; ctx.fillStyle = P.inkPaper; y += 50 * U;
      const ak = outCubic(seg(u, 0.32, 0.5));
      ctx.globalAlpha = ak * 0.82;
      for (const line of apo.lines) { ctx.fillText(line, -cardW / 2 + 56 * U, y + (1 - ak) * 20 * U); y += apo.size * 1.3; }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ cierre
  let logo = null;
  function drawOutro(t, t0) {
    const u = seg(t, t0, S.duration);
    const wipe = inOut(seg(u, 0, 0.25));
    // hoja de color que barre la pantalla
    const p = new Path2D();
    const edge = lerp(H * 1.1, -H * 0.1, wipe);
    p.moveTo(0, H); p.lineTo(W, H); p.lineTo(W, edge - 80 * U); p.quadraticCurveTo(W / 2, edge + 60 * U, 0, edge); p.closePath();
    paperShape(p, P.accent, 1.2);
    const k = outBack(seg(u, 0.18, 0.42));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(lerp(0.85, 1, k), lerp(0.85, 1, k)); ctx.globalAlpha = clamp(k * 1.4);
    const c = fit(S.cierre || '', 700, W - 200 * U, H * 0.3, 104 * U);
    ctx.fillStyle = P.inkAccent; ctx.font = c.font; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    let y = -c.lines.length * c.size * 1.08 / 2 - (logo || S.marca ? 90 * U : 0);
    for (const l of c.lines) { ctx.fillText(l, 0, y); y += c.size * 1.08; }
    // placa de papel con logo o nombre de marca
    const pk = outCubic(seg(u, 0.35, 0.55));
    if (logo || S.marca) {
      const pw = 420 * U, ph = 150 * U, py = y + 50 * U + (1 - pk) * 40 * U;
      ctx.globalAlpha = pk;
      paperShape(roundRect(-pw / 2, py, pw, ph, 24 * U), P.paper, 0.9);
      if (logo) {
        const s = Math.min((pw - 60 * U) / logo.width, (ph - 40 * U) / logo.height);
        ctx.drawImage(logo, -logo.width * s / 2, py + ph / 2 - logo.height * s / 2, logo.width * s, logo.height * s);
      } else {
        ctx.fillStyle = P.inkPaper; ctx.font = `700 ${46 * U}px "DM Sans", sans-serif`; ctx.textBaseline = 'middle';
        ctx.fillText(S.marca, 0, py + ph / 2, pw - 40 * U);
      }
    }
    ctx.restore();
  }

  function render(t) {
    ctx.save(); ctx.textAlign = 'left';
    background(t);
    const outroStart = S.duration - T_OUTRO;
    escenas.forEach((e, i) => {
      const t0 = T_INTRO + i * sceneLen;
      if (t >= t0 - 0.01 && t < t0 + sceneLen + 0.6) drawScene(e, t0, Math.min(t, t0 + sceneLen), i);
    });
    if (t >= outroStart) drawOutro(t, outroStart);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  const fonts = (S.fontUrls || []).map(([w, url]) => new FontFace('DM Sans', `url(${url})`, { weight: String(w) }).load().then((f) => document.fonts.add(f)));
  const logoP = S.logoUrl ? new Promise((res) => { const im = new Image(); im.onload = () => { logo = im; res(); }; im.onerror = () => res(); im.src = S.logoUrl; }) : Promise.resolve();
  window.ANIM = { render, ready: Promise.all([...fonts, logoP]), palette: P };
})();
</script>
</body>
</html>
