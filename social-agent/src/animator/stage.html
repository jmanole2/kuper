<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
'use strict';
// Escenario donde corre el código que escribe Claude. Expone window.STAGE.
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { willReadFrequently: false });
  let K, prog, state, boxes = null;

  // Determinismo: nada de azar ni reloj real dentro del código generado.
  const seeded = (() => { let s = 42; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
  Math.random = seeded;
  Date.now = () => 0;
  performance.now = () => 0;

  // Registro de cajas de texto visibles (para detectar texto cortado o fuera de zona segura).
  const P = CanvasRenderingContext2D.prototype;
  for (const fn of ['fillText', 'strokeText']) {
    const orig = P[fn];
    P[fn] = function (text, x, y, maxW) {
      if (boxes && this === ctx && this.globalAlpha > 0.6 && String(text).trim()) {
        const m = this.measureText(text);
        let w = maxW !== undefined ? Math.min(m.width, maxW) : m.width;
        const al = this.textAlign, bl = this.textBaseline;
        let x0 = al === 'center' ? x - w / 2 : (al === 'right' || al === 'end') ? x - w : x;
        const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
        const y0 = y - asc, y1 = y + desc;
        const T = this.getTransform();
        const pts = [[x0, y0], [x0 + w, y0], [x0, y1], [x0 + w, y1]].map(([px, py]) => [T.a * px + T.c * py + T.e, T.b * px + T.d * py + T.f]);
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        boxes.push({ text: String(text).slice(0, 40), x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys), size: parseFloat(/(\d+(?:\.\d+)?)px/.exec(this.font)?.[1] || 0) * Math.hypot(T.a, T.b) });
      }
      return orig.call(this, text, x, y, ...(maxW === undefined ? [] : [maxW]));
    };
  }

  async function init(spec, code, assets) {
    cv.width = spec.width; cv.height = spec.height;
    const fontLoads = (spec.fonts || []).map((f) => new FontFace(f.family, `url(${f.url})`, { weight: String(f.weight) }).load().then((ff) => document.fonts.add(ff)));
    const img = (src) => (src ? new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }) : Promise.resolve(null));
    const [logo, mark] = await Promise.all([img(assets.logo), img(assets.mark), ...fontLoads]);
    K = window.makeKit(spec, { logo, mark });
    K._bindCtx(ctx);
    const factory = new Function('K', `"use strict";\n${code}\n;return { draw: typeof draw === 'function' ? draw : null, setup: typeof setup === 'function' ? setup : null };`);
    prog = factory(K);
    if (!prog.draw) throw new Error('El código no define la función draw(ctx, t, K).');
    state = prog.setup ? prog.setup(K) : undefined;
    K.state = state;
    return true;
  }

  function frame(t, track = false) {
    boxes = track ? [] : null;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, cv.width, cv.height);
    try { prog.draw(ctx, t, K); } finally { ctx.restore(); }
    const b = boxes; boxes = null; return b;
  }

  function stats() {
    const s = 64, c = document.createElement('canvas'); c.width = s; c.height = Math.round(s * cv.height / cv.width);
    const g = c.getContext('2d'); g.drawImage(cv, 0, 0, c.width, c.height);
    const d = g.getImageData(0, 0, c.width, c.height).data; let sum = 0, sum2 = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; sum += l; sum2 += l * l; n++; }
    const mean = sum / n; return { mean, std: Math.sqrt(Math.max(0, sum2 / n - mean * mean)) };
  }

  /** Renderiza varios tiempos y reporta errores, cuadros vacíos y texto fuera de lugar. */
  function probe(times, slides = 1) {
    const out = { errors: [], warnings: [], frames: 0 };
    const seen = new Set();
    for (let s = 0; s < slides; s++) {
      K.slide = s;
      for (const t of times) {
        let b;
        try { b = frame(t, true); out.frames++; } catch (e) { out.errors.push(`t=${t.toFixed(2)}s${slides > 1 ? ` slide ${s + 1}` : ''}: ${e && e.message || e}`); if (out.errors.length > 5) return out; continue; }
        const st = stats();
        if (st.std < 2.5) out.warnings.push(`t=${t.toFixed(2)}s${slides > 1 ? ` slide ${s + 1}` : ''}: el cuadro está casi vacío (color plano).`);
        for (const bx of b) {
          const key = bx.text + '|' + Math.round(bx.y0 / 20);
          const off = bx.x0 < -2 || bx.y0 < -2 || bx.x1 > cv.width + 2 || bx.y1 > cv.height + 2;
          if (off && !seen.has('off' + key)) { seen.add('off' + key); out.errors.push(`t=${t.toFixed(2)}s${slides > 1 ? ` slide ${s + 1}` : ''}: el texto "${bx.text}" se sale del cuadro (x ${Math.round(bx.x0)}–${Math.round(bx.x1)}, y ${Math.round(bx.y0)}–${Math.round(bx.y1)}; lienzo ${cv.width}x${cv.height}).`); }
          const sf = K.safe;
          const unsafe = !off && (bx.x0 < sf.left - 4 || bx.x1 > sf.right + 4 || bx.y0 < sf.top - 4 || bx.y1 > sf.bottom + 4);
          if (unsafe && !seen.has('safe' + key)) { seen.add('safe' + key); out.warnings.push(`t=${t.toFixed(2)}s: el texto "${bx.text}" queda fuera de la zona segura (K.safe), la interfaz de la red lo puede tapar.`); }
          if (bx.size && bx.size < 22 * K.U && !seen.has('small' + bx.text)) { seen.add('small' + bx.text); out.warnings.push(`El texto "${bx.text}" mide ${Math.round(bx.size)}px: muy chico para leerse en el celular (mínimo ~${Math.round(26 * K.U)}px).`); }
        }
      }
    }
    K.slide = 0;
    return out;
  }

  function capture(t, type = 'image/png', slide = 0) {
    K.slide = slide; frame(t);
    return cv.toDataURL(type, 0.92);
  }

  /** Hoja de contacto: varios cuadros en una sola imagen, con su tiempo. */
  function sheet(items, cols = 4, cellW = 360) {
    const cellH = Math.round(cellW * cv.height / cv.width);
    const rows = Math.ceil(items.length / cols);
    const sc = document.createElement('canvas'); sc.width = cols * cellW + (cols + 1) * 12; sc.height = rows * (cellH + 34) + 12;
    const g = sc.getContext('2d'); g.fillStyle = '#e9e9ee'; g.fillRect(0, 0, sc.width, sc.height);
    items.forEach((it, i) => {
      K.slide = it.slide || 0; frame(it.t);
      const x = 12 + (i % cols) * (cellW + 12), y = 12 + Math.floor(i / cols) * (cellH + 34);
      g.drawImage(cv, x, y, cellW, cellH);
      g.fillStyle = '#222'; g.font = '600 18px sans-serif'; g.fillText(it.label, x, y + cellH + 22);
    });
    K.slide = 0;
    return sc.toDataURL('image/png');
  }

  window.STAGE = { init, frame, probe, capture, sheet };
})();
</script>
</body>
</html>
