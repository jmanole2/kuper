<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><canvas id="c" width="1080" height="1920"></canvas>
<script src="mascota2.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const ease=t=>1-Math.pow(1-t,3), cl=v=>Math.max(0,Math.min(1,v)), back=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const POS=[[-300,-520],[0,-640],[300,-520],[-330,-200],[330,-200],[0,520]]; // alrededor
window.frame=(t)=>{ // 5 s
  bg(x,1080,1920);
  const CX=540,CY=1010;
  // arco que une las tarjetas
  const arcA=cl((t-1.4)/1);x.save();x.strokeStyle='rgba(140,255,42,.18)';x.lineWidth=2;x.setLineDash([6,10]);x.beginPath();x.arc(CX,CY,420,Math.PI*1.05,Math.PI*1.05+Math.PI*0.9*arcA*2);x.stroke();x.restore();
  const pop=cl(t/0.6), base=cl(t/0.5);
  const squash=t>0.6&&t<0.9?Math.sin((t-0.6)/.3*Math.PI):0;
  const blink=(t>2.3&&t<2.45)?Math.sin((t-2.3)/.15*Math.PI):0;
  const expr=t>3.4?'feliz':t>1.2&&t<1.7?'sorprendido':'normal';
  const wave=t>3.4?(0.7+0.3*Math.sin((t-3.4)*Math.PI*5))*cl((t-3.4)/.2):0;
  const look=t>1.6&&t<3.2?Math.sin((t-1.6)*2.2)*0.8:0;
  CARDS.forEach((cd,i)=>{const k=cl((t-1.3-i*0.22)/0.45);if(k<=0)return;const [dx,dy]=POS[i];
    glassCard(x,{...cd,cx:CX+dx*ease(k)*0.98,cy:CY+dy*ease(k)+Math.sin(t*2+i)*6,a:k,sc:0.6+0.4*back(k)});});
  drawMascota(x,{cx:CX,cy:CY+(1-ease(pop))*80,s:1.25*(0.6+0.4*back(pop)),expr,blink,wave,look,squash,base});
  grain(x,1080,1920,.045,(Math.floor(t*12)%7)+3);
};
</script></body></html>
