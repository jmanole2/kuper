<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><canvas id="c" width="1080" height="1920"></canvas>
<script src="mascota2.js"></script><script src="mascota4.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const ease=t=>1-Math.pow(1-t,3), cl=v=>Math.max(0,Math.min(1,v)), back=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const POS=[[-300,-1080],[0,-1200],[300,-1080],[-340,-760],[340,-760],[0,200]];
window.frame=(t)=>{ // 6 s
  bg(x,1080,1920);
  const CX=540,CY=1330;
  // entra de un salto
  const j=cl(t/0.7), hop=t<0.7?Math.sin(j*Math.PI)*260:0, squash=t>0.7&&t<0.95?Math.sin((t-0.7)/.25*Math.PI):0;
  const xin=CX-260*(1-ease(j));
  const expr=t>4.3?'feliz':t>1.0&&t<1.6?'sorprendido':t>3.3&&t<4.3?'estrellas':'normal';
  const blink=(t>2.4&&t<2.55)?Math.sin((t-2.4)/.15*Math.PI):0;
  const look=t>1.6&&t<3.2?Math.sin((t-1.6)*2.4)*0.9:0;
  const wave=t>4.4?(0.75+0.25*Math.sin((t-4.4)*Math.PI*5))*cl((t-4.4)/.2):0;
  CARDS.forEach((cd,i)=>{const k=cl((t-1.5-i*0.25)/0.45);if(k<=0)return;const [dx,dy]=POS[i];
    glassCard(x,{...cd,cx:CX+dx*ease(k),cy:CY+dy*ease(k)+Math.sin(t*2+i)*6,a:k,sc:0.6+0.4*back(k)});});
  drawKuper(x,{cx:xin,cy:CY,s:1.4,hop,squash,expr,blink,look,wave});
  grain(x,1080,1920,.04,(Math.floor(t*12)%7)+3);
};
</script></body></html>
