<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videollamada con agente</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#f2f3f5; --muted:#9aa0ab; --accent:#5b8cff; --danger:#ff5b6b; --line:#2a2f3a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:960px; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:1.5rem; margin:0; }
  p { margin:0; color:var(--muted); }
  .stage { position:relative; aspect-ratio:16/9; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:grid; place-items:center; }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { text-align:center; padding:24px; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 20px; cursor:pointer; background:var(--accent); color:#fff; }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  input { flex:1; min-width:220px; font:inherit; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  summary { cursor:pointer; font-weight:600; }
  details .row { margin-top:12px; }
  .status { min-height:1.5em; }
  .status.error { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1 id="title">Videollamada con tu agente</h1>
  <p>Permite el acceso a cámara y micrófono cuando el navegador lo pida.</p>

  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Pulsa «Iniciar videollamada» para hablar con el agente.</div>
  </div>

  <div class="row">
    <button id="start">Iniciar videollamada</button>
    <button id="end" class="danger" disabled>Colgar</button>
  </div>

  <details>
    <summary>Enviar el agente a una reunión de Zoom, Google Meet o Teams</summary>
    <div class="row">
      <input id="meeting" type="url" placeholder="https://meet.google.com/abc-defg-hij">
      <button id="send">Enviar a la reunión</button>
    </div>
  </details>

  <p class="status" id="status"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let conversationId = null;

  const setStatus = (msg, isError = false) => {
    $('status').textContent = msg;
    $('status').className = 'status' + (isError ? ' error' : '');
  };

  async function api(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  async function start(meetingUrl) {
    $('start').disabled = $('send').disabled = true;
    setStatus(meetingUrl ? 'Enviando el agente a la reunión…' : 'Conectando con el agente…');
    try {
      const conv = await api('/api/conversation', { meetingUrl });
      conversationId = conv.conversationId;
      $('end').disabled = false;
      if (meetingUrl) {
        setStatus(`${conv.agentName} va en camino a la reunión. Si hay sala de espera, admítelo.`);
      } else {
        $('placeholder').hidden = true;
        const frame = document.createElement('iframe');
        frame.src = conv.conversationUrl;
        frame.allow = 'camera; microphone; fullscreen; display-capture; autoplay';
        $('stage').appendChild(frame);
        setStatus('');
      }
    } catch (err) {
      setStatus('No se pudo iniciar: ' + err.message, true);
      $('start').disabled = $('send').disabled = false;
    }
  }

  async function end() {
    if (!conversationId) return;
    $('end').disabled = true;
    try { await api(`/api/conversation/${conversationId}/end`); } catch (err) { setStatus('Error al colgar: ' + err.message, true); }
    conversationId = null;
    $('stage').querySelector('iframe')?.remove();
    $('placeholder').hidden = false;
    $('start').disabled = $('send').disabled = false;
    if (!$('status').classList.contains('error')) setStatus('Llamada terminada.');
  }

  $('start').onclick = () => start();
  $('send').onclick = () => {
    const url = $('meeting').value.trim();
    if (!url) return setStatus('Pega primero el enlace de la reunión.', true);
    start(url);
  };
  $('end').onclick = end;
  window.addEventListener('beforeunload', () => {
    if (conversationId) navigator.sendBeacon(`/api/conversation/${conversationId}/end`);
  });

  fetch('/api/info').then((r) => r.json()).then((info) => {
    $('title').textContent = `Videollamada con ${info.agentName}`;
    if (!info.hasKey) setStatus('Falta TAVUS_API_KEY en el servidor (archivo tavus-agent/.env).', true);
  });
</script>
</body>
</html>
