<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novaplastica — Inyección de plástico</title>
<style>
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-200-normal.woff2) format("woff2");font-weight:200}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist Mono";src:url(fonts/geist-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist Mono";src:url(fonts/geist-mono-latin-500-normal.woff2) format("woff2");font-weight:500}

:root{
  --bg:#ECEEF0; --bg-2:#F6F7F8; --navy:#1E2C3F; --navy-2:#2A3B52; --muted:#6B7685;
  --wine:#8C2236; --line:rgba(30,44,63,.12);
  --sans:"Geist","Helvetica Neue",sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.hero{position:relative;height:100vh;min-height:820px;overflow:hidden;
  background:radial-gradient(60% 70% at 50% 46%,#FFFFFF 0,#F3F4F6 45%,var(--bg) 100%)}
/* technical grid, fading out from the center */
.grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:72px 72px;background-position:center center;opacity:.55;
  -webkit-mask-image:radial-gradient(55% 60% at 50% 50%,transparent 30%,#000 75%);mask-image:radial-gradient(55% 60% at 50% 50%,transparent 30%,#000 75%)}

/* nav */
nav{position:absolute;top:20px;left:32px;right:32px;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:12px 12px 12px 24px;border-radius:16px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px -18px rgba(30,44,63,.25)}
nav img{height:40px;display:block}
nav ul{display:flex;gap:6px;list-style:none}
nav li{font-size:12px;letter-spacing:.14em;font-weight:500;padding:10px 16px;border-radius:10px;color:var(--navy-2)}
nav li.on{background:rgba(30,44,63,.06)}
nav .cta{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.14em;font-weight:600;padding:14px 20px;border-radius:11px}
nav .cta svg{width:14px;height:14px}
nav .burger{display:none}

/* left headline */
.head{position:absolute;left:64px;top:50%;transform:translateY(-40%);z-index:4;max-width:400px}
.head .idx{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:28px}
.head .idx i{width:28px;height:1px;background:var(--muted)}
.head h1{font-size:50px;line-height:1.02;font-weight:500;letter-spacing:-.035em}
.head h1 span{color:var(--wine)}
.head .rule{margin-top:40px;display:flex;align-items:center;width:240px}
.head .rule b{flex:1;height:1px;background:var(--navy)}
.head .rule i{width:9px;height:9px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 5px rgba(30,44,63,.08)}

/* stage */
.stage{position:absolute;left:50%;top:52%;width:640px;height:700px;transform:translate(-50%,-50%);z-index:3}
.halo{position:absolute;left:50%;top:44%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#FFFFFF 0,rgba(255,255,255,.9) 40%,rgba(255,255,255,0) 70%)}
.ring{position:absolute;left:50%;top:44%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid var(--line)}
.table{position:absolute;left:0;bottom:40px;width:100%;height:200px}
.bucket{position:absolute;left:50%;bottom:142px;width:400px;transform:translateX(-50%)}
.bucket .body{display:block;width:100%;position:relative;z-index:2;filter:drop-shadow(0 26px 22px rgba(30,44,63,.16))}
.bucket .handle{position:absolute;left:0;top:-200px;width:400px;height:260px;z-index:1;overflow:visible}
.bucket .ears{position:absolute;left:0;top:-200px;width:400px;height:260px;z-index:3;overflow:visible}

/* right stat */
.stat{position:absolute;right:64px;top:50%;transform:translateY(-62%);z-index:4;text-align:left}
.stat .num{display:flex;align-items:flex-start;font-weight:200;font-size:210px;line-height:.8;letter-spacing:-.06em}
.stat .num sup{font-size:48px;font-weight:400;color:var(--wine);margin:10px 8px 0 0;letter-spacing:0}
.stat .lbl{margin-top:26px;font-family:var(--mono);font-size:13px;letter-spacing:.22em;font-weight:500}
.stat .rule{margin-top:26px;display:flex;align-items:center;width:320px}
.stat .rule b{flex:1;height:1px;background:var(--navy)}
.stat .rule i{width:9px;height:9px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 5px rgba(30,44,63,.08)}

/* drag hint */
.hint{position:absolute;right:64px;bottom:72px;z-index:5;display:flex;align-items:center;gap:18px;padding:16px 26px 16px 16px;border-radius:18px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 40px -24px rgba(30,44,63,.35)}
.hint .ic{width:58px;height:58px;border-radius:14px;background:var(--navy);display:grid;place-items:center}
.hint .ic svg{width:34px;height:34px}
.hint b{display:block;font-size:20px;font-weight:500;letter-spacing:-.01em}
.hint span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .hint .ic svg .spin{transform-origin:17px 17px;animation:spin 6s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}

.scroll{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;width:22px;height:34px;border:1.5px solid rgba(30,44,63,.35);border-radius:12px}
.scroll::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:7px;border-radius:2px;background:rgba(30,44,63,.5);transform:translateX(-50%)}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .hero{height:auto;min-height:0;padding:96px 18px 28px}
  nav{left:12px;right:12px;top:12px;padding:10px 10px 10px 16px}
  nav img{height:32px}
  nav ul,nav .cta span{display:none}
  nav .cta{padding:12px}
  nav .burger{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:rgba(30,44,63,.06);margin-right:8px}
  nav .right{display:flex;align-items:center}
  .head{position:relative;left:auto;top:auto;transform:none;max-width:none;padding-top:16px}
  .head .idx{margin-bottom:16px}
  .head h1{font-size:38px}
  .head .rule{display:none}
  .stage{position:relative;left:auto;top:auto;transform:none;width:100%;height:440px;margin-top:6px}
  .halo{width:340px;height:340px}
  .ring{display:none}
  .table{bottom:10px;height:120px}
  .bucket{width:236px;bottom:72px}
  .bucket .handle,.bucket .ears{width:236px;height:153px;top:-118px}
  .stat{position:relative;right:auto;top:auto;transform:none;display:flex;align-items:center;gap:18px;padding:18px 0;border-top:1px solid var(--line)}
  .stat .num{font-size:96px}
  .stat .num sup{font-size:32px;margin:4px 4px 0 0}
  .stat .lbl{margin-top:0;font-size:12px;line-height:1.5}
  .stat .rule{display:none}
  .hint{position:relative;right:auto;bottom:auto;margin-top:8px;padding:12px 18px 12px 12px}
  .hint .ic{width:48px;height:48px}
  .hint b{font-size:17px}
  .scroll{display:none}
  .grid{background-size:48px 48px}
}
</style>
</head>
<body>
<section class="hero">
  <div class="grid"></div>

  <nav>
    <a><img src="assets/logo.png" alt="Novaplastica"></a>
    <ul><li class="on">EXPERIENCIA</li><li>NOSOTROS</li><li>VALORES</li><li>PREMIOS</li><li>COBERTURA</li></ul>
    <div class="right">
      <span class="burger"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 6h14M2 12h14" stroke="#1E2C3F" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <a class="cta"><span>CONTACTO</span><svg viewBox="0 0 14 14"><path d="M3 11L11 3M5 3h6v6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </nav>

  <div class="head">
    <div class="idx">01 <i></i></div>
    <h1>Empresa mexicana especializada en <span>inyección de plástico.</span></h1>
    <div class="rule"><b></b><i></i></div>
  </div>

  <div class="stage">
    <div class="ring" style="width:620px;height:620px"></div>
    <div class="ring" style="width:470px;height:470px;border-style:dashed"></div>
    <div class="halo"></div>

    <!-- turntable -->
    <svg class="table" viewBox="0 0 720 200" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E7EB"/></linearGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DAE0"/><stop offset="1" stop-color="#C3C9D1"/></linearGradient>
        <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1E2C3F" stop-opacity=".22"/><stop offset="1" stop-color="#1E2C3F" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="360" cy="140" rx="330" ry="56" fill="url(#sh)"/>
      <path d="M70 92 a290 62 0 0 0 580 0 v14 a290 62 0 0 1 -580 0z" fill="url(#edge)"/>
      <ellipse cx="360" cy="92" rx="290" ry="62" fill="url(#top)" stroke="rgba(30,44,63,.10)"/>
      <ellipse cx="360" cy="92" rx="250" ry="52" fill="none" stroke="rgba(30,44,63,.10)"/>
      <g id="ticks" stroke="#1E2C3F" stroke-opacity=".35" stroke-width="1"></g>
      <ellipse cx="360" cy="96" rx="150" ry="28" fill="url(#sh)"/>
      <g font-family="Geist Mono, monospace" font-size="10" fill="#6B7685" text-anchor="middle">
        <text x="360" y="168">0°</text>
      </g>
      <!-- rotate arrows -->
      <g fill="none" stroke="#8C2236" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M175 150 q-60 -14 -88 -38"/><path d="M92 102 l-6 10 l11 1"/>
        <path d="M545 150 q60 -14 88 -38"/><path d="M628 102 l6 10 l-11 1"/>
      </g>
    </svg>

    <div class="bucket">
      <svg class="handle" viewBox="0 0 400 260">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9CED6"/><stop offset=".45" stop-color="#FAFBFC"/><stop offset="1" stop-color="#BFC5CE"/></linearGradient></defs>
        <path d="M14 236 C 10 30, 390 30, 386 236" fill="none" stroke="#A9B0BA" stroke-width="11" stroke-linecap="round"/>
        <path d="M14 236 C 10 30, 390 30, 386 236" fill="none" stroke="url(#hg)" stroke-width="8" stroke-linecap="round"/>
        <path d="M60 110 C 130 54, 270 54, 340 110" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="200" cy="203" rx="186" ry="10" fill="#F5F6F7" stroke="#D3D8DE"/>
      </svg>
      <img class="body" src="assets/cubeta.png" alt="Cubeta Novaplastica">
      <svg class="ears" viewBox="0 0 400 260">
        <circle cx="14" cy="236" r="7" fill="#EEF0F2" stroke="#B9C0C9"/>
        <circle cx="386" cy="236" r="7" fill="#E2E5E9" stroke="#B9C0C9"/>
      </svg>
    </div>
  </div>

  <div class="stat">
    <div class="num"><sup>+</sup>30</div>
    <div class="lbl">AÑOS DE<br>EXPERIENCIA</div>
    <div class="rule"><i></i><b></b></div>
  </div>

  <div class="hint">
    <span class="ic"><svg viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <g class="spin"><path d="M29 17a12 5 0 0 1-17.5 4.4"/><path d="M5 17a12 5 0 0 1 17.5-4.4"/><path d="M12 18.5l-1 3 3 1"/><path d="M22 15.5l1-3-3-1"/></g>
      <path d="M17 9v16" stroke-opacity=".55"/></svg></span>
    <div><b>Gira la cubeta</b><span>Arrastra con el mouse o tu dedo</span></div>
  </div>

  <div class="scroll"></div>
</section>

<script>
  // tick marks around the turntable rim
  const g = document.getElementById('ticks'), ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const L = i % 6 === 0 ? 10 : 5, line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', 360 + 272 * c); line.setAttribute('y1', 92 + 58 * s);
    line.setAttribute('x2', 360 + (272 - L) * c); line.setAttribute('y2', 92 + (58 - L * .21) * s);
    if (s < 0) line.setAttribute('stroke-opacity', '.18');
    g.appendChild(line);
  }
</script>
</body>
</html>
