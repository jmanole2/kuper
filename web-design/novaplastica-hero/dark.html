<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novaplastica — Inyección de plástico</title>
<style>
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-200-normal.woff2) format("woff2");font-weight:200}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Geist";src:url(fonts/geist-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist Mono";src:url(fonts/geist-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist Mono";src:url(fonts/geist-mono-latin-500-normal.woff2) format("woff2");font-weight:500}

:root{
  --bg:#06080B; --bg-2:#0D1117; --white:#F3F5F7; --muted:#8A94A3; --dim:rgba(243,245,247,.08);
  --cyan:#7FE3EC; --wine:#E05A70; --navy:#1E2C3F;
  --sans:"Geist","Helvetica Neue",sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.hero{position:relative;height:100vh;min-height:820px;overflow:hidden;
  background:
    radial-gradient(38% 46% at 50% 0%,rgba(190,215,235,.16),rgba(190,215,235,0) 70%),
    radial-gradient(50% 60% at 50% 55%,#121821 0,#0A0D12 55%,var(--bg) 100%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:4px 4px;
  -webkit-mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent);mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent)}

/* spotlight beam */
.beam{position:absolute;left:50%;top:-40px;width:760px;height:760px;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(210,228,240,.10) 16deg,rgba(210,228,240,.16) 20deg,rgba(210,228,240,.10) 24deg,transparent 40deg);
  -webkit-mask-image:linear-gradient(#000 20%,transparent 85%);mask-image:linear-gradient(#000 20%,transparent 85%);filter:blur(6px)}

/* nav */
nav{position:absolute;top:22px;left:32px;right:32px;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:10px 10px 10px 22px;border-radius:16px;background:rgba(246,247,249,.94);backdrop-filter:blur(14px);box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
nav img{height:38px;display:block}
nav ul{display:flex;gap:4px;list-style:none}
nav li{font-size:12px;letter-spacing:.14em;font-weight:500;padding:10px 16px;border-radius:10px;color:#2A3B52}
nav li.on{background:rgba(30,44,63,.07)}
nav .cta{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.14em;font-weight:600;padding:14px 20px;border-radius:11px}
nav .cta svg{width:14px;height:14px}
nav .burger{display:none}

/* orbit system */
.orbit{position:absolute;left:50%;top:53%;width:0;height:0;z-index:1}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.r1{width:600px;height:600px;border:1px solid rgba(243,245,247,.14)}
.r2{width:780px;height:780px;border:1px solid rgba(243,245,247,.07)}
.r3{width:440px;height:440px;border:1px dashed rgba(243,245,247,.10)}
.ticks{position:absolute;left:50%;top:50%;width:780px;height:780px;transform:translate(-50%,-50%)}
.spin{position:absolute;left:50%;top:50%;width:600px;height:600px;transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.node{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid var(--cyan);background:var(--bg);box-shadow:0 0 0 5px rgba(127,227,236,.12),0 0 18px rgba(127,227,236,.6);transform:translate(-50%,-50%)}
.cross{position:absolute;width:16px;height:16px;transform:translate(-50%,-50%)}
.cross::before,.cross::after{content:"";position:absolute;left:50%;top:50%;background:var(--cyan);box-shadow:0 0 10px rgba(127,227,236,.7);transform:translate(-50%,-50%)}
.cross::before{width:16px;height:2px}.cross::after{width:2px;height:16px}
.arc{position:absolute;left:50%;top:50%;width:600px;height:600px;transform:translate(-50%,-50%)}

/* bucket */
.stage{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:3;width:420px;height:560px;perspective:900px}
.glow{position:absolute;left:50%;top:44%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(220,232,242,.22),rgba(220,232,242,.05) 45%,transparent 68%)}
.bucket{position:absolute;left:50%;top:40px;width:380px;transform:translateX(-50%) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .2s}
.bucket img{display:block;width:100%;filter:drop-shadow(0 0 30px rgba(220,235,245,.18)) drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.floor{position:absolute;left:50%;bottom:6px;width:420px;height:70px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.85),rgba(0,0,0,0))}
.floor-light{position:absolute;left:50%;bottom:22px;width:560px;height:110px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(180,210,230,.10),rgba(180,210,230,0));border:1px solid rgba(243,245,247,.06)}

/* stat left */
.stat{position:absolute;left:72px;top:50%;transform:translateY(-38%);z-index:4}
.stat .num{display:flex;align-items:flex-start;font-weight:200;font-size:230px;line-height:.78;letter-spacing:-.065em}
.stat .num sup{font-size:56px;font-weight:400;color:var(--cyan);margin:14px 10px 0 0;letter-spacing:0;text-shadow:0 0 18px rgba(127,227,236,.5)}
.stat .lbl{margin-top:30px;font-family:var(--mono);font-size:13px;letter-spacing:.24em;font-weight:500;color:var(--white)}
.stat .bar{margin-top:22px;width:300px;height:1px;background:linear-gradient(90deg,rgba(243,245,247,.6),rgba(243,245,247,0))}

/* text right */
.copy{position:absolute;right:120px;top:50%;transform:translateY(-78%);z-index:4;width:360px}
.copy .tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:22px}
.copy .tag i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.copy h1{font-size:38px;line-height:1.12;font-weight:500;letter-spacing:-.025em}
.copy h1 span{color:var(--wine)}

/* socials */
.social{position:absolute;right:40px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px}
.social::before,.social::after{content:"";width:1px;height:56px;background:linear-gradient(transparent,rgba(243,245,247,.25))}
.social::after{background:linear-gradient(rgba(243,245,247,.25),transparent)}
.social a{width:34px;height:34px;border-radius:50%;border:1px solid rgba(243,245,247,.16);display:grid;place-items:center}
.social svg{width:14px;height:14px;fill:var(--white)}

/* drag control */
.hint{position:absolute;right:120px;bottom:64px;z-index:5;width:360px;padding:18px 20px;border-radius:18px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px)}
.hint .top{display:flex;align-items:center;gap:14px}
.hint .ic{width:44px;height:44px;border-radius:12px;background:var(--white);display:grid;place-items:center;flex:none}
.hint .ic svg{width:26px;height:26px}
.hint b{display:block;font-size:17px;font-weight:500}
.hint span{font-size:12px;color:var(--muted)}
.hint .deg{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--cyan)}
.track{position:relative;margin-top:16px;height:22px;cursor:grab}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:repeating-linear-gradient(90deg,rgba(243,245,247,.35) 0 1px,transparent 1px 10px)}
.track .knob{position:absolute;top:50%;left:var(--k,50%);width:22px;height:22px;border-radius:50%;background:var(--white);transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 18px rgba(255,255,255,.35)}

.scroll{position:absolute;left:72px;bottom:64px;z-index:5;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.scroll i{position:relative;width:22px;height:34px;border:1.5px solid rgba(243,245,247,.3);border-radius:12px}
.scroll i::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:7px;border-radius:2px;background:rgba(243,245,247,.6);transform:translateX(-50%)}

@media (prefers-reduced-motion:no-preference){
  .spin{animation:rot 40s linear infinite}
  @keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .hero{height:auto;min-height:0;padding:96px 18px 28px;display:flex;flex-direction:column}
  .copy{order:1}.stage{order:2}.stat{order:3}.hint{order:4}
  nav{left:12px;right:12px;top:12px;padding:10px 10px 10px 16px}
  nav img{height:32px}
  nav ul,nav .cta span{display:none}
  nav .cta{padding:12px}
  nav .burger{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:rgba(30,44,63,.07);margin-right:8px}
  nav .right{display:flex;align-items:center}
  .copy{position:relative;right:auto;top:auto;transform:none;width:auto;padding-top:20px}
  .copy h1{font-size:30px}
  .orbit{top:440px}
  .r1{width:340px;height:340px}.r2{width:440px;height:440px}.r3{width:250px;height:250px}
  .ticks{width:440px;height:440px}
  .spin,.arc{width:340px;height:340px}
  .stage{position:relative;left:auto;top:auto;transform:none;margin:10px auto 0;width:100%;height:360px}
  .glow{width:340px;height:340px}
  .bucket{width:240px;top:20px}
  .floor{width:260px;height:44px}
  .floor-light{width:330px;height:70px}
  .beam{width:460px;height:560px}
  .stat{position:relative;left:auto;top:auto;transform:none;display:flex;align-items:center;gap:16px;padding:20px 0;border-top:1px solid rgba(243,245,247,.1)}
  .stat .num{font-size:100px}
  .stat .num sup{font-size:30px;margin:6px 4px 0 0}
  .stat .lbl{margin-top:0;font-size:12px;line-height:1.6}
  .stat .bar,.social,.scroll{display:none}
  .hint{position:relative;right:auto;bottom:auto;width:auto;margin-top:6px}
}
</style>
</head>
<body>
<section class="hero">
  <div class="beam"></div>

  <nav>
    <a><img src="assets/logo.png" alt="Novaplastica"></a>
    <ul><li class="on">EXPERIENCIA</li><li>NOSOTROS</li><li>VALORES</li><li>PREMIOS</li><li>COBERTURA</li></ul>
    <div class="right">
      <span class="burger"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 6h14M2 12h14" stroke="#1E2C3F" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <a class="cta"><span>CONTACTO</span><svg viewBox="0 0 14 14"><path d="M3 11L11 3M5 3h6v6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </nav>

  <div class="orbit">
    <div class="ring r2"></div>
    <svg class="ticks" viewBox="0 0 780 780" id="ticks"></svg>
    <div class="ring r1"></div>
    <div class="ring r3"></div>
    <svg class="arc" viewBox="0 0 600 600"><circle cx="300" cy="300" r="299.5" fill="none" stroke="#7FE3EC" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="210 1672" stroke-dashoffset="-1180" stroke-linecap="round"/></svg>
    <div class="spin">
      <span class="node" style="left:86%;top:15%"></span>
      <span class="cross" style="left:2%;top:62%"></span>
      <span class="cross" style="left:94%;top:74%"></span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="floor-light"></div>
    <div class="floor"></div>
    <div class="bucket" id="bucket"><img src="assets/cubeta-dark.png" alt="Cubeta Novaplastica" draggable="false"></div>
  </div>

  <div class="stat">
    <div class="num"><sup>+</sup>30</div>
    <div class="lbl">AÑOS DE EXPERIENCIA</div>
    <div class="bar"></div>
  </div>

  <div class="copy">
    <div class="tag"><i></i>NOVAPLASTICA</div>
    <h1>Empresa mexicana especializada en <span>inyección de plástico.</span></h1>
  </div>

  <div class="social">
    <a aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M14 8V6.5c0-.8.2-1.3 1.4-1.3H17V2.2C16.7 2.1 15.7 2 14.6 2 12.2 2 10.6 3.4 10.6 6.1V8H8v3.3h2.6V22H14V11.3h2.7l.4-3.3z"/></svg></a>
    <a aria-label="X"><svg viewBox="0 0 24 24"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg></a>
    <a aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 7.3A4.7 4.7 0 1012 16.7 4.7 4.7 0 0012 7.3zm0 7.7a3 3 0 110-6 3 3 0 010 6zm4.9-7.9a1.1 1.1 0 11-2.2 0 1.1 1.1 0 012.2 0zM12 3.6c2.7 0 3 0 4.1.1 2.7.1 3.9 1.4 4 4 .1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.1 2.6-1.3 3.9-4 4-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1c-2.7-.1-3.9-1.4-4-4C3.8 15 3.8 14.7 3.8 12s0-3 .1-4.1c.1-2.6 1.3-3.9 4-4C9 3.6 9.3 3.6 12 3.6zM12 2C9.3 2 8.9 2 7.8 2.1 4.2 2.2 2.2 4.2 2.1 7.8 2 8.9 2 9.3 2 12s0 3.1.1 4.2c.1 3.6 2.1 5.6 5.7 5.7 1.1.1 1.5.1 4.2.1s3.1 0 4.2-.1c3.6-.1 5.6-2.1 5.7-5.7.1-1.1.1-1.5.1-4.2s0-3.1-.1-4.2c-.1-3.6-2.1-5.6-5.7-5.7C15.1 2 14.7 2 12 2z"/></svg></a>
  </div>

  <div class="hint">
    <div class="top">
      <span class="ic"><svg viewBox="0 0 26 26" fill="none" stroke="#06080B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 13a9 3.6 0 0 1-12.6 3.4"/><path d="M4 13a9 3.6 0 0 1 12.6-3.4"/><path d="M9.6 14.2l-.8 2.4 2.4.6"/><path d="M16.4 11.8l.8-2.4-2.4-.6"/><path d="M13 6v14" stroke-opacity=".45"/></svg></span>
      <div><b>Gira la cubeta</b><span>Arrastra con el mouse o tu dedo</span></div>
      <span class="deg" id="deg">0°</span>
    </div>
    <div class="track" id="track"><span class="knob"></span></div>
  </div>

  <div class="scroll"><i></i></div>
</section>

<script>
  // tick ring
  const t = document.getElementById('ticks'), ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2, L = i % 10 === 0 ? 14 : 6, l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', 390 + 388 * Math.cos(a)); l.setAttribute('y1', 390 + 388 * Math.sin(a));
    l.setAttribute('x2', 390 + (388 - L) * Math.cos(a)); l.setAttribute('y2', 390 + (388 - L) * Math.sin(a));
    l.setAttribute('stroke', '#F3F5F7'); l.setAttribute('stroke-opacity', i % 10 === 0 ? '.35' : '.14');
    t.appendChild(l);
  }
  // drag: tilt the bucket and move the slider (placeholder until the 3D model is wired in)
  const stage = document.getElementById('stage'), bucket = document.getElementById('bucket'),
        track = document.getElementById('track'), deg = document.getElementById('deg');
  let down = false, x0 = 0, angle = 0, a0 = 0;
  const set = a => {
    angle = Math.max(-180, Math.min(180, a));
    bucket.style.setProperty('--ry', (angle * 0.2) + 'deg');
    track.style.setProperty('--k', (50 + angle / 3.6) + '%');
    deg.textContent = Math.round((angle + 360) % 360) + '°';
  };
  [stage, track].forEach(el => el.addEventListener('pointerdown', e => { down = true; x0 = e.clientX; a0 = angle; el.setPointerCapture(e.pointerId); }));
  addEventListener('pointermove', e => { if (down) set(a0 + (e.clientX - x0) * 0.8); });
  addEventListener('pointerup', () => { down = false; });
</script>
</body>
</html>
